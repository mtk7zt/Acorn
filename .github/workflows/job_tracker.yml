name: Multi-Board Job Tracker Bot (LinkedIn, Indeed, Job Bank CA)

on:
  schedule:
    # Runs automatically every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: 'Send a test connection message to Telegram'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_chat_id:
        description: 'Target recipient Telegram chat ID (user isolation)'
        required: false
        default: ''
        type: string
      target_roles:
        description: 'Comma-separated target roles for user scan'
        required: false
        default: ''
        type: string
      user_id:
        description: 'Canonical Acorn user ID'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: job-tracker-state
  cancel-in-progress: false

jobs:
  track-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit test suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

      - name: Run job tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_CHAT_ID: ${{ github.event.inputs.target_chat_id }}
          TEST_TELEGRAM: ${{ github.event.inputs.test_telegram || 'false' }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.target_chat_id }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --target-chat-id ${{ github.event.inputs.target_chat_id }}"
          fi
          if [ -n "${{ github.event.inputs.target_roles }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --roles \"${{ github.event.inputs.target_roles }}\""
          fi
          if [ -n "${{ github.event.inputs.user_id }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --user-id ${{ github.event.inputs.user_id }}"
          fi
          python job_tracker_bot.py $EXTRA_ARGS

      - name: Commit updated state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/runtime/ingestion/seen_jobs.json data/runtime/config/roles_config.json data/runtime/config/bot_config.json seen_jobs.json roles_config.json bot_config.json
          git diff --staged --quiet || git commit -m "chore: update job tracker state [skip ci]"
          git push
