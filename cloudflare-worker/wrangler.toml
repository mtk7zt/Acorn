name = "acorn-bot"
main = "index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Workers KV namespace — run `npx wrangler kv namespace create CHAT_HISTORY`
# then paste the id below
[[kv_namespaces]]
binding = "CHAT_HISTORY"
id = "ed6edf9b53cf4d868b207e28bea8b6fb"

# Cloudflare D1 SQL database binding
[[d1_databases]]
binding = "ACORN_DB"
database_name = "acorn-production-db"
database_id = "acorn-production-db-id"

# Secrets (set via CLI or Terraform):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_SECRET_TOKEN
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put GITHUB_PAT
#   npx wrangler secret put ALLOWED_CHAT_ID
#   npx wrangler secret put ACORN_FOUNDER_TELEGRAM_ID
#   npx wrangler secret put ACTIVATION_PEPPER
